<h2 id="the-shared-datapath--one-decode-one-alu">The shared datapath — one decode, one ALU</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-verilog"><span class="hljs-comment">// the micro-op in, and what each stage leaves behind</span>
<span class="hljs-keyword">typedef</span> <span class="hljs-keyword">enum</span> { OpAdd, OpSub, OpMul, OpSlt } AluOp deriving (Bits, Eq, FShow);
<span class="hljs-keyword">typedef</span> <span class="hljs-keyword">struct</span> { AluOp op; Int<span class="hljs-variable">#(32) a; Int#(32) b; } AluReq  deriving (Bits, FShow)</span>;
<span class="hljs-keyword">typedef</span> <span class="hljs-keyword">struct</span> { AluOp op; Int<span class="hljs-variable">#(32) a; Int#(32) b; } Decoded deriving (Bits, FShow)</span>;
<span class="hljs-keyword">typedef</span> <span class="hljs-keyword">struct</span> { Bit<span class="hljs-variable">#(8) inum; Int#(32) res;       } AluRes  deriving (Bits, FShow)</span>;

<span class="hljs-keyword">function</span> Decoded decode (AluReq r);            <span class="hljs-comment">// crack op, forward operands</span>
   <span class="hljs-keyword">return</span> Decoded { op: r<span class="hljs-variable">.op</span>, a: r<span class="hljs-variable">.a</span>, b: r<span class="hljs-variable">.b</span> };
<span class="hljs-keyword">endfunction</span>

<span class="hljs-keyword">function</span> Int<span class="hljs-variable">#(32) execute (Decoded d)</span>;         <span class="hljs-comment">// the ALU — shared by all 3 controllers</span>
   <span class="hljs-keyword">return</span> <span class="hljs-keyword">case</span> (d<span class="hljs-variable">.op</span>)
             OpAdd: (d<span class="hljs-variable">.a</span> + d<span class="hljs-variable">.b</span>);   OpSub: (d<span class="hljs-variable">.a</span> - d<span class="hljs-variable">.b</span>);
             OpMul: (d<span class="hljs-variable">.a</span> * d<span class="hljs-variable">.b</span>);   OpSlt: ((d<span class="hljs-variable">.a</span> &lt; d<span class="hljs-variable">.b</span>) ? <span class="hljs-number">1</span> : <span class="hljs-number">0</span>);
          <span class="hljs-keyword">endcase</span>;
<span class="hljs-keyword">endfunction</span>

<span class="hljs-keyword">interface</span> AluEngine;                           <span class="hljs-comment">// one contract, three implementations</span>
   method Action               put (AluReq r); <span class="hljs-comment">// hand in a micro-op</span>
   method ActionValue<span class="hljs-variable">#(AluRes)</span> get;            <span class="hljs-comment">// take out a result</span>
<span class="hljs-keyword">endinterface</span>
</code></pre>
<p><span class="caption">All three controllers implement <code>AluEngine</code> and call these same <code>decode</code> / <code>execute</code>.</span></p>

<h2 id="controller-1--mkalu_rules">Controller 1 — <code>mkAlu_Rules</code></h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-verilog"><span class="hljs-keyword">typedef</span> <span class="hljs-keyword">enum</span> { Idle, Dec, Exe, WB } Stage deriving (Bits, Eq);   <span class="hljs-comment">// the four states</span>

<span class="hljs-keyword">module</span> mkAlu_Rules (AluEngine);
   Reg<span class="hljs-variable">#(Stage)          st   &lt;- mkReg(Idle)</span>;            <span class="hljs-comment">// which stage is active</span>
   Reg<span class="hljs-variable">#(AluReq)</span>         reqR &lt;- mkRegU;                 <span class="hljs-comment">// the op being processed</span>
   Reg<span class="hljs-variable">#(Decoded)</span>        decR &lt;- mkRegU;                 <span class="hljs-comment">// Decode  -&gt; Execute latch</span>
   Reg<span class="hljs-variable">#(Int#(32))</span>       resR &lt;- mkRegU;                 <span class="hljs-comment">// Execute -&gt; Writeback latch</span>
   Reg<span class="hljs-variable">#(Maybe#(AluRes)) outR &lt;- mkReg(tagged Invalid)</span>;  <span class="hljs-comment">// 1-slot output buffer</span>
   Reg<span class="hljs-variable">#(Bit#(8))        inum &lt;- mkReg(0)</span>;

   <span class="hljs-comment">// one rule per stage, each guarded by `st` — exactly one fires per cycle</span>
   rule r_decode    (st == Dec);  decR &lt;= decode (reqR);   st &lt;= Exe;  endrule
   rule r_execute   (st == Exe);  resR &lt;= execute (decR);  st &lt;= WB;   endrule
   rule r_writeback (st == WB);
      outR &lt;= <span class="hljs-keyword">tagged</span> Valid AluRes { inum: inum, res: resR };
      inum &lt;= inum + <span class="hljs-number">1</span>;   st &lt;= Idle;
   endrule

   method Action put (AluReq r) <span class="hljs-keyword">if</span> (st == Idle &amp;&amp; !isValid(outR));  <span class="hljs-comment">// accept when free</span>
      reqR &lt;= r;  st &lt;= Dec;
   endmethod
   method ActionValue<span class="hljs-variable">#(AluRes) get if (outR matches tagged Valid .x)</span>;
      outR &lt;= <span class="hljs-keyword">tagged</span> Invalid;  <span class="hljs-keyword">return</span> x;                <span class="hljs-comment">// hand back the result</span>
   endmethod
<span class="hljs-keyword">endmodule</span>
</code></pre>
<p><span class="caption">The <code>Stage</code> register <em>is</em> the schedule — one rule per stage, guarded by it.</span></p>

<header>Advanced Computer Architecture · Monsoon 2026</header>

<h2 id="controller-2--mkalu_fsm-the-same-steps-as-a-program">Controller 2 — <code>mkAlu_FSM</code> (the same steps, as a program)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-verilog"><span class="hljs-keyword">module</span> mkAlu_FSM (AluEngine);
   FIFOF<span class="hljs-variable">#(AluReq) inF  &lt;- mkFIFOF;      // input  port (put enqueues here)</span>
   FIFOF<span class="hljs-variable">#(AluRes) outF &lt;- mkFIFOF;      // output port (get dequeues here)</span>
   Reg<span class="hljs-variable">#(AluReq)</span>   cur  &lt;- mkRegU;
   Reg<span class="hljs-variable">#(Decoded)</span>  decR &lt;- mkRegU;
   Reg<span class="hljs-variable">#(Int#(32))</span> resR &lt;- mkRegU;
   Reg<span class="hljs-variable">#(Bit#(8))  inum &lt;- mkReg(0)</span>;

   <span class="hljs-comment">// the SAME four steps as mkAlu_Rules — but written as a program, one cycle/step</span>
   mkAutoFSM (
      seq <span class="hljs-keyword">while</span> (True) seq
         action  cur  &lt;= inF<span class="hljs-variable">.first</span>;  inF<span class="hljs-variable">.deq</span>;  endaction   <span class="hljs-comment">// accept</span>
         action  decR &lt;= decode  (cur);        endaction   <span class="hljs-comment">// Decode</span>
         action  resR &lt;= execute (decR);       endaction   <span class="hljs-comment">// Execute</span>
         action  outF<span class="hljs-variable">.enq</span> (AluRes { inum: inum, res: resR });   <span class="hljs-comment">// Writeback</span>
                 inum &lt;= inum + <span class="hljs-number">1</span>;             endaction
      endseq endseq);

   method Action               put (AluReq r);  inF<span class="hljs-variable">.enq</span> (r);                 endmethod
   method ActionValue<span class="hljs-variable">#(AluRes)</span> get;             outF<span class="hljs-variable">.deq</span>;  <span class="hljs-keyword">return</span> outF<span class="hljs-variable">.first</span>; endmethod
<span class="hljs-keyword">endmodule</span>
</code></pre>
<p><span class="caption"><code>StmtFSM</code> builds the <em>same</em> state register + one-rule-per-step as Controller 1 — sugar over the same machine. This is <code>Drum_FSM.bsv</code>.</span></p>

<header>Advanced Computer Architecture · Monsoon 2026</header>

<h2 id="controller-3--mkalu_pipe-fifos-several-in-flight">Controller 3 — <code>mkAlu_Pipe</code> (FIFOs, several in flight)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-verilog"><span class="hljs-keyword">module</span> mkAlu_Pipe (AluEngine);
   FIFOF<span class="hljs-variable">#(AluReq)</span>   f_in  &lt;- mkFIFOF;   <span class="hljs-comment">// input     -&gt; decode</span>
   FIFOF<span class="hljs-variable">#(Decoded)</span>  f_dx  &lt;- mkFIFOF;   <span class="hljs-comment">// decode    -&gt; execute</span>
   FIFOF<span class="hljs-variable">#(Int#(32))</span> f_xw  &lt;- mkFIFOF;   <span class="hljs-comment">// execute   -&gt; writeback</span>
   FIFOF<span class="hljs-variable">#(AluRes)</span>   f_out &lt;- mkFIFOF;   <span class="hljs-comment">// writeback -&gt; output</span>
   Reg<span class="hljs-variable">#(Bit#(8))    inum  &lt;- mkReg(0)</span>;

   <span class="hljs-comment">// one guarded rule per stage; ALL fire each cycle their FIFOs allow -&gt; 3 in flight</span>
   rule s_decode;   f_dx<span class="hljs-variable">.enq</span> (decode  (f_in<span class="hljs-variable">.first</span>));  f_in<span class="hljs-variable">.deq</span>;  endrule
   rule s_execute;  f_xw<span class="hljs-variable">.enq</span> (execute (f_dx<span class="hljs-variable">.first</span>));  f_dx<span class="hljs-variable">.deq</span>;  endrule
   rule s_writeback;
      f_out<span class="hljs-variable">.enq</span> (AluRes { inum: inum, res: f_xw<span class="hljs-variable">.first</span> });
      inum &lt;= inum + <span class="hljs-number">1</span>;   f_xw<span class="hljs-variable">.deq</span>;
   endrule

   method Action               put (AluReq r);  f_in<span class="hljs-variable">.enq</span> (r);                 endmethod
   method ActionValue<span class="hljs-variable">#(AluRes)</span> get;             f_out<span class="hljs-variable">.deq</span>;  <span class="hljs-keyword">return</span> f_out<span class="hljs-variable">.first</span>; endmethod
<span class="hljs-keyword">endmodule</span>
</code></pre>
<p><span class="caption">All three rules fire every cycle their FIFOs allow — 3 ops in flight. This is Fife (L1's <code>mkPipeElastic</code>).</span></p>

<h2 id="the-catch">The catch</h2>

<li>Share a <strong>register file</strong> → op <em>N+1</em> needs op <em>N</em>'s result: a <strong>hazard</strong>.</li>
</ul>

<h2 id="the-tiny-isa--4-registers-7-ops-one-alu">The Tiny ISA — 4 registers, 7 ops, one ALU</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-verilog"><span class="hljs-keyword">typedef</span> <span class="hljs-keyword">enum</span> { OpAdd, OpSub, OpAnd, OpOr, OpSlt, OpLi, OpBne } Op   <span class="hljs-comment">// 7 opcodes</span>
   deriving (Bits, Eq, FShow);
<span class="hljs-keyword">typedef</span> Bit<span class="hljs-variable">#(2)</span>  RegId;     <span class="hljs-comment">// r0 .. r3</span>
<span class="hljs-keyword">typedef</span> Int<span class="hljs-variable">#(32)</span> Word;      <span class="hljs-comment">// register / ALU value</span>
<span class="hljs-keyword">typedef</span> Bit<span class="hljs-variable">#(4)</span>  Pc;        <span class="hljs-comment">// index into a 16-entry ROM</span>

<span class="hljs-keyword">typedef</span> <span class="hljs-keyword">struct</span> { Op op; RegId rd; RegId rs1; RegId rs2; Word imm; } <span class="hljs-comment">// fixed format</span>
   Instr deriving (Bits, FShow);

<span class="hljs-keyword">function</span> Bool writesReg (Op op) = (op != OpBne);      <span class="hljs-comment">// everything but BNE writes rd</span>

<span class="hljs-keyword">function</span> Word alu (Op op, Word a, Word b, Word imm);  <span class="hljs-comment">// the stream ALU, plus LI</span>
   <span class="hljs-keyword">case</span> (op)
      OpAdd: <span class="hljs-keyword">return</span> a + b;                 OpSub: <span class="hljs-keyword">return</span> a - b;
      OpAnd: <span class="hljs-keyword">return</span> unpack(pack(a) &amp; pack(b));
      OpOr:  <span class="hljs-keyword">return</span> unpack(pack(a) | pack(b));
      OpSlt: <span class="hljs-keyword">return</span> (a &lt; b) ? <span class="hljs-number">1</span> : <span class="hljs-number">0</span>;       OpLi:  <span class="hljs-keyword">return</span> imm;
      <span class="hljs-keyword">default</span>: <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;                   <span class="hljs-comment">// BNE: control, no result</span>
   <span class="hljs-keyword">endcase</span>
<span class="hljs-keyword">endfunction</span>

<span class="hljs-keyword">function</span> Bool branchTaken (Op op, Word a, Word b) = (op == OpBne) &amp;&amp; (a != b);
</code></pre>
<p><span class="caption">code/tiny-cpu/TinyCPU.bsv · the same <code>alu</code> as the stream ALU, plus <code>LI</code> — no memory (that is L3).</span></p>

<h2 id="the-program-well-run--sum-15-then-double-it">The program we'll run — sum 1..5, then double it</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-verilog"><span class="hljs-number">0</span>:  LI  r0, <span class="hljs-number">0</span>        <span class="hljs-comment">// acc     = 0</span>
<span class="hljs-number">1</span>:  LI  r1, <span class="hljs-number">5</span>        <span class="hljs-comment">// counter = 5   (counts down)</span>
<span class="hljs-number">2</span>:  LI  r2, <span class="hljs-number">1</span>        <span class="hljs-comment">// decrement</span>
<span class="hljs-number">3</span>:  LI  r3, <span class="hljs-number">0</span>        <span class="hljs-comment">// zero (compare target)</span>
<span class="hljs-number">4</span>:  ADD r0, r0, r1   <span class="hljs-comment">// acc += counter        &lt;-- loop top</span>
<span class="hljs-number">5</span>:  SUB r1, r1, r2   <span class="hljs-comment">// counter -= 1</span>
<span class="hljs-number">6</span>:  BNE r1, r3, <span class="hljs-number">4</span>    <span class="hljs-comment">// if counter != 0 goto 4</span>
<span class="hljs-number">7</span>:  ADD r2, r0, r0   <span class="hljs-comment">// r2 = 2 * acc          (runs once, after the loop)</span>
</code></pre>
<p><span class="caption">Expected final state: <strong>r0 = 15 · r1 = 0 · r2 = 30 · r3 = 0.</strong> Tight dependencies (each op needs the last) + one backward branch — enough to make TinyFife stall <em>and</em> squash.</span></p>
<footer>IIIT · Suresh Purini</footer>
</section>

<header>Advanced Computer Architecture · Monsoon 2026</header>

<h2 id="tinydrum--one-instruction-at-a-time-stmtfsm">TinyDrum — one instruction at a time (StmtFSM)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-verilog"><span class="hljs-keyword">module</span> mkTinyDrum (Empty);
   Vector<span class="hljs-variable">#(16, Instr)     prog = theProgram ()</span>;
   Vector<span class="hljs-variable">#(4, Reg#(Word)) rf  &lt;- replicateM (mkReg (0))</span>;   <span class="hljs-comment">// r0..r3</span>
   Reg<span class="hljs-variable">#(Pc)               pc  &lt;- mkReg (0)</span>;
   Reg<span class="hljs-variable">#(Instr) ir &lt;- mkRegU;  Reg#(Word)</span> a   &lt;- mkRegU;
   Reg<span class="hljs-variable">#(Word)  b  &lt;- mkRegU;  Reg#(Word)</span> res &lt;- mkRegU;

   mkAutoFSM (seq
      <span class="hljs-keyword">while</span> (pc &lt; fromInteger (progLen)) seq
         action  ir  &lt;= prog[pc];                     endaction   <span class="hljs-comment">// FETCH</span>
         action  a   &lt;= rf[ir<span class="hljs-variable">.rs1</span>];  b &lt;= rf[ir<span class="hljs-variable">.rs2</span>]; endaction   <span class="hljs-comment">// DECODE</span>
         action  res &lt;= alu (ir<span class="hljs-variable">.op</span>, a, b, ir<span class="hljs-variable">.imm</span>);    endaction   <span class="hljs-comment">// EXECUTE</span>
         action                                                   <span class="hljs-comment">// WRITEBACK</span>
            <span class="hljs-keyword">if</span> (ir<span class="hljs-variable">.op</span> == OpBne)
               pc &lt;= branchTaken (ir<span class="hljs-variable">.op</span>, a, b) ? truncate (pack (ir<span class="hljs-variable">.imm</span>)) : pc + <span class="hljs-number">1</span>;
            <span class="hljs-keyword">else</span> <span class="hljs-keyword">begin</span>
               <span class="hljs-keyword">for</span> (Integer k = <span class="hljs-number">0</span>; k &lt; <span class="hljs-number">4</span>; k = k + <span class="hljs-number">1</span>)
                  <span class="hljs-keyword">if</span> (fromInteger (k) == ir<span class="hljs-variable">.rd</span>) rf[k] &lt;= res;
               pc &lt;= pc + <span class="hljs-number">1</span>;
            <span class="hljs-keyword">end</span>
         endaction
      endseq endseq);
<span class="hljs-keyword">endmodule</span>
</code></pre>
<p><span class="caption">Same four steps as <code>mkAlu_FSM</code>, now over a real PC + register file. One instruction fully retires before the next — so the register file is always current: <strong>no hazard.</strong></span></p>
<footer>IIIT · Suresh Purini</footer>
</section>

<header>Advanced Computer Architecture · Monsoon 2026</header>

<h2 id="tinydrum-runs--strictly-in-order">TinyDrum runs — strictly in order</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">[drum] pc=4 OpAdd   r0=0  r1=5 r2=1 r3=0
[drum] pc=5 OpSub   r0=5  r1=5 r2=1 r3=0
[drum] pc=6 OpBne   r0=5  r1=4 r2=1 r3=0
[drum] pc=4 OpAdd   r0=5  r1=4 r2=1 r3=0
        ...   (five times round the loop)   ...
[drum] pc=6 OpBne   r0=15 r1=0 r2=1 r3=0
[drum] pc=7 OpAdd   r0=15 r1=0 r2=1 r3=0
[drum] DONE  r0=15 r1=0 r2=30 r3=0   (81 cycles)
</code></pre>
<p><span class="caption">Correct — 4 FSM steps per instruction, one at a time. <strong>81 cycles.</strong> Now: can we overlap them?</span></p>
<footer>IIIT · Suresh Purini</footer>

<h2 id="tinyfife--data-hazard--stall">TinyFife — data hazard = stall</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-verilog">FIFOF<span class="hljs-variable">#(F2D) f2d &lt;- mkFIFOF;           // Fetch  -&gt; Decode   (2-deep, decouples fetch)</span>
FIFOF<span class="hljs-variable">#(D2E) d2e &lt;- mkPipelineFIFOF;   // Decode -&gt; Execute  (1-deep)</span>
FIFOF<span class="hljs-variable">#(E2W) e2w &lt;- mkPipelineFIFOF;   // Execute-&gt; Writeback(1-deep)</span>

<span class="hljs-comment">// each stage BROADCASTS the register it is about to produce (1-deep =&gt; 1 in flight each)</span>
Wire<span class="hljs-variable">#(Maybe#(RegId)) exProd &lt;- mkDWire (tagged Invalid)</span>;   <span class="hljs-comment">// in Execute now</span>
Wire<span class="hljs-variable">#(Maybe#(RegId)) wbProd &lt;- mkDWire (tagged Invalid)</span>;   <span class="hljs-comment">// in Writeback now</span>
<span class="hljs-keyword">function</span> Bool inFlight (RegId r) = (isValid(exProd) &amp;&amp; validValue(exProd) == r)
                                || (isValid(wbProd) &amp;&amp; validValue(wbProd) == r);

rule r_fetch (rg_pc &lt; fromInteger (progLen));
   f2d<span class="hljs-variable">.enq</span> (F2D { pc: rg_pc, instr: prog[rg_pc], epoch: rg_epoch });
   rg_pc &lt;= rg_pc + <span class="hljs-number">1</span>;                                     <span class="hljs-comment">// speculative fall-through</span>
endrule

rule r_decode;
   <span class="hljs-keyword">let</span> f = f2d<span class="hljs-variable">.first</span>;
   Bool stall = (f<span class="hljs-variable">.instr</span><span class="hljs-variable">.op</span> != OpLi)
             &amp;&amp; (inFlight (f<span class="hljs-variable">.instr</span><span class="hljs-variable">.rs1</span>) || inFlight (f<span class="hljs-variable">.instr</span><span class="hljs-variable">.rs2</span>));   <span class="hljs-comment">// RAW?</span>
   <span class="hljs-keyword">if</span> (!stall) <span class="hljs-keyword">begin</span>
      f2d<span class="hljs-variable">.deq</span>;
      d2e<span class="hljs-variable">.enq</span> (D2E { pc:f<span class="hljs-variable">.pc</span>, instr:f<span class="hljs-variable">.instr</span>,
                     a: rf[f<span class="hljs-variable">.instr</span><span class="hljs-variable">.rs1</span>], b: rf[f<span class="hljs-variable">.instr</span><span class="hljs-variable">.rs2</span>], epoch:f<span class="hljs-variable">.epoch</span> });
   <span class="hljs-keyword">end</span>                                                     <span class="hljs-comment">// else: hold, retry next cycle</span>
endrule
</code></pre>
<p><span class="caption">No scoreboard register: because <code>d2e</code>/<code>e2w</code> are 1-deep, each stage's single in-flight op is exactly what it broadcasts. Decode stalls while a source is still being produced.</span></p>

<h2 id="bypass--the-mechanism-in-code">Bypass — the mechanism in code</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-verilog"><span class="hljs-comment">// each producer stage broadcasts what it will write, on a DWire &quot;bus&quot;:</span>
<span class="hljs-keyword">typedef</span> <span class="hljs-keyword">struct</span> { RegId rd; Word val; Epoch epoch; } Fwd deriving (Bits);
Wire<span class="hljs-variable">#(Maybe#(Fwd)) exFwd &lt;- mkDWire (tagged Invalid);  // set by r_execute   (result)</span>
Wire<span class="hljs-variable">#(Maybe#(Fwd)) wbFwd &lt;- mkDWire (tagged Invalid);  // set by r_writeback (value)</span>

<span class="hljs-comment">// THE FORWARDING MUX: freshest producer wins (Execute &gt; Writeback), else the regfile</span>
<span class="hljs-keyword">function</span> Word srcVal (RegId rs, Epoch ep);
   <span class="hljs-keyword">if</span>      (exFwd <span class="hljs-keyword">matches</span> <span class="hljs-keyword">tagged</span> Valid <span class="hljs-variable">.p</span> &amp;&amp;&amp; (p<span class="hljs-variable">.rd</span> == rs) &amp;&amp;&amp; (p<span class="hljs-variable">.epoch</span> == ep)) <span class="hljs-keyword">return</span> p<span class="hljs-variable">.val</span>;
   <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (wbFwd <span class="hljs-keyword">matches</span> <span class="hljs-keyword">tagged</span> Valid <span class="hljs-variable">.p</span> &amp;&amp;&amp; (p<span class="hljs-variable">.rd</span> == rs) &amp;&amp;&amp; (p<span class="hljs-variable">.epoch</span> == ep)) <span class="hljs-keyword">return</span> p<span class="hljs-variable">.val</span>;
   <span class="hljs-keyword">else</span>                                                                        <span class="hljs-keyword">return</span> rf[rs];
<span class="hljs-keyword">endfunction</span>

<span class="hljs-comment">// Decode reads operands through srcVal, not the register file → it never waits:</span>
rule r_decode;
   <span class="hljs-keyword">let</span> f = f2d<span class="hljs-variable">.first</span>;  f2d<span class="hljs-variable">.deq</span>;
   d2e<span class="hljs-variable">.enq</span> (D2E { pc: f<span class="hljs-variable">.pc</span>, instr: f<span class="hljs-variable">.instr</span>,
                  a: srcVal (f<span class="hljs-variable">.instr</span><span class="hljs-variable">.rs1</span>, f<span class="hljs-variable">.epoch</span>),
                  b: srcVal (f<span class="hljs-variable">.instr</span><span class="hljs-variable">.rs2</span>, f<span class="hljs-variable">.epoch</span>), epoch: f<span class="hljs-variable">.epoch</span> });
endrule
</code></pre>
<p><span class="caption"><code>TinyFifeBypass.bsv</code> · <code>srcVal</code> replaces the register-file read; the <code>epoch</code> guard blocks forwarding across a squash.</span></p>
<footer>IIIT · Suresh Purini</footer>

<header>Advanced Computer Architecture · Monsoon 2026</header>

<h2 id="tinyfife--control-hazard--epochs">TinyFife — control hazard = epochs</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-verilog">rule r_execute;
   <span class="hljs-keyword">let</span> y = d2e<span class="hljs-variable">.first</span>;  d2e<span class="hljs-variable">.deq</span>;
   <span class="hljs-keyword">if</span> (writesReg (y<span class="hljs-variable">.instr</span><span class="hljs-variable">.op</span>)) exProd &lt;= <span class="hljs-keyword">tagged</span> Valid y<span class="hljs-variable">.instr</span><span class="hljs-variable">.rd</span>;      <span class="hljs-comment">// announce</span>
   e2w<span class="hljs-variable">.enq</span> (E2W { pc:y<span class="hljs-variable">.pc</span>, instr:y<span class="hljs-variable">.instr</span>,
                  res:    alu (y<span class="hljs-variable">.instr</span><span class="hljs-variable">.op</span>, y<span class="hljs-variable">.a</span>, y<span class="hljs-variable">.b</span>, y<span class="hljs-variable">.instr</span><span class="hljs-variable">.imm</span>),
                  taken:  branchTaken (y<span class="hljs-variable">.instr</span><span class="hljs-variable">.op</span>, y<span class="hljs-variable">.a</span>, y<span class="hljs-variable">.b</span>),
                  target: truncate (pack (y<span class="hljs-variable">.instr</span><span class="hljs-variable">.imm</span>)), epoch: y<span class="hljs-variable">.epoch</span> });
endrule

rule r_writeback;
   <span class="hljs-keyword">let</span> x = e2w<span class="hljs-variable">.first</span>;  e2w<span class="hljs-variable">.deq</span>;
   Bool live = (x<span class="hljs-variable">.epoch</span> == rg_epoch);           <span class="hljs-comment">// stale epoch =&gt; wrong path</span>
   <span class="hljs-keyword">if</span> (live) <span class="hljs-keyword">begin</span>
      <span class="hljs-keyword">if</span> (writesReg (x<span class="hljs-variable">.instr</span><span class="hljs-variable">.op</span>)) <span class="hljs-keyword">begin</span>
         writeRF (x<span class="hljs-variable">.instr</span><span class="hljs-variable">.rd</span>, x<span class="hljs-variable">.res</span>);
         wbProd &lt;= <span class="hljs-keyword">tagged</span> Valid x<span class="hljs-variable">.instr</span><span class="hljs-variable">.rd</span>;      <span class="hljs-comment">// producing rf THIS cycle</span>
      <span class="hljs-keyword">end</span>
      <span class="hljs-keyword">if</span> (x<span class="hljs-variable">.taken</span>) <span class="hljs-keyword">begin</span>
         rg_pc    &lt;= x<span class="hljs-variable">.target</span>;
         rg_epoch &lt;= rg_epoch + <span class="hljs-number">1</span>;               <span class="hljs-comment">// bump epoch -&gt; squash fall-through</span>
      <span class="hljs-keyword">end</span>
   <span class="hljs-keyword">end</span>                                           <span class="hljs-comment">// !live =&gt; squashed: drop it</span>
endrule
</code></pre>
<p><span class="caption">Fetch stamps every instruction with <code>rg_epoch</code>; a taken branch bumps it; anything reaching writeback with a stale epoch is <strong>squashed</strong>. Exactly Fife's epoch mechanism.</span></p>
<footer>IIIT · Suresh Purini</footer>

<h2 id="tinyfife-runs--overlapped-and-it-squashes">TinyFife runs — overlapped, and it squashes</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">[fife] wb pc=5 OpSub          r0=5  r1=5 r2=1 r3=0
[fife] wb pc=6 OpBne          r0=5  r1=4 r2=1 r3=0
[fife] wb pc=7 OpAdd SQUASH   r0=5  r1=4 r2=1 r3=0   &lt;- wrong-path fall-through, dropped
[fife] wb pc=4 OpAdd          r0=5  r1=4 r2=1 r3=0
        ...   (each taken branch squashes the speculatively-fetched pc=7)   ...
[fife] wb pc=6 OpBne          r0=15 r1=0 r2=1 r3=0
[fife] wb pc=7 OpAdd          r0=15 r1=0 r2=1 r3=0   &lt;- last one is real: r2 = 30
[fife] DONE  r0=15 r1=0 r2=30 r3=0   (49 cycles)
</code></pre>
<p><span class="caption">Identical architectural result as TinyDrum — <strong>49 cycles vs 81.</strong> Every taken <code>BNE</code> is followed by a squashed <code>pc=7</code>; only the final, correct one writes <code>r2</code>.</span></p>
