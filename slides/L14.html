<header>Advanced Computer Architecture · Monsoon 2026</header>

<h2 id="roofline-analysis">Roofline Analysis</h2>
<h1 id="one-kernel-two-decisions">One kernel. Two decisions.</h1>
<p><strong>The programmer:</strong> the machine is fixed. Make the program faster.</p>
<p><strong>The architect:</strong> the area is fixed. Build a better machine.</p>
<p>Lecture 14 · Advanced Computer Architecture</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-header="Advanced Computer Architecture · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="aca" data-lang="en" lang="en" data-marpit-pagination="2" style="--paginate:true;--header:Advanced Computer Architecture · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:aca;--lang:en;" data-marpit-pagination-total="83">
<header>Advanced Computer Architecture · Monsoon 2026</header>
<h2 id="start-with-four-pairs-of-numbers">Start with four pairs of numbers</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">x = [1, 2, 3, 4]
y = [5, 6, 7, 8]

s = 0
s += 1x5;  s += 2x6;  s += 3x7;  s += 4x8
</code></pre>
<p>The answer is <strong>70</strong>. Each iteration does one multiply and one add.</p>
<blockquote>
<p>Before we time anything: what work must the machine actually do?</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-header="Advanced Computer Architecture · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="aca" data-lang="en" lang="en" data-marpit-pagination="3" style="--paginate:true;--header:Advanced Computer Architecture · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:aca;--lang:en;" data-marpit-pagination-total="83">
<header>Advanced Computer Architecture · Monsoon 2026</header>
<h2 id="one-loop-two-kinds-of-work">One loop, two kinds of work</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">double</span> s = <span class="hljs-number">0</span>;
<span class="hljs-keyword">for</span> (<span class="hljs-type">size_t</span> i = <span class="hljs-number">0</span>; i &lt; N; ++i)
    s += x[i] * y[i];
</code></pre>
<p>For each pair: <strong>2 floating-point operations</strong> and <strong>16 bytes of input</strong>.</p>
<p>FP64 throughout — each <code>double</code> is 8 bytes.</p>
<p>The accumulator <code>s</code> stays in a register, so it costs no memory traffic.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-header="Advanced Computer Architecture · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="aca" data-lang="en" lang="en" data-marpit-pagination="4" style="--paginate:true;--header:Advanced Computer Architecture · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:aca;--lang:en;" data-marpit-pagination-total="83">
<header>Advanced Computer Architecture · Monsoon 2026</header>
<h2 id="now-make-the-problem-large">Now make the problem large</h2>
<p><strong>N = 16 million pairs</strong>, with the inputs larger than the last-level cache.</p>
<table>
<thead>
<tr>
<th>quantity</th>
<th>calculation</th>
<th>amount</th>
</tr>
</thead>
<tbody>
<tr>
<td>work, <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.05ex;" xmlns="http://www.w3.org/2000/svg" width="2.371ex" height="1.595ex" role="img" focusable="false" viewBox="0 -683 1048 705"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D44A" d="M436 683Q450 683 486 682T553 680Q604 680 638 681T677 682Q695 682 695 674Q695 670 692 659Q687 641 683 639T661 637Q636 636 621 632T600 624T597 615Q597 603 613 377T629 138L631 141Q633 144 637 151T649 170T666 200T690 241T720 295T759 362Q863 546 877 572T892 604Q892 619 873 628T831 637Q817 637 817 647Q817 650 819 660Q823 676 825 679T839 682Q842 682 856 682T895 682T949 681Q1015 681 1034 683Q1048 683 1048 672Q1048 666 1045 655T1038 640T1028 637Q1006 637 988 631T958 617T939 600T927 584L923 578L754 282Q586 -14 585 -15Q579 -22 561 -22Q546 -22 542 -17Q539 -14 523 229T506 480L494 462Q472 425 366 239Q222 -13 220 -15T215 -19Q210 -22 197 -22Q178 -22 176 -15Q176 -12 154 304T131 622Q129 631 121 633T82 637H58Q51 644 51 648Q52 671 64 683H76Q118 680 176 680Q301 680 313 683H323Q329 677 329 674T327 656Q322 641 318 637H297Q236 634 232 620Q262 160 266 136L501 550L499 587Q496 629 489 632Q483 636 447 637Q428 637 422 639T416 648Q416 650 418 660Q419 664 420 669T421 676T424 680T428 682T436 683Z"></path></g></g></g></svg></mjx-container></td>
<td>2 x 16 million</td>
<td><strong>32 million FLOPs</strong></td>

<td>traffic, <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.439ex;" xmlns="http://www.w3.org/2000/svg" width="1.79ex" height="2.032ex" role="img" focusable="false" viewBox="0 -704 791 898"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D444" d="M399 -80Q399 -47 400 -30T402 -11V-7L387 -11Q341 -22 303 -22Q208 -22 138 35T51 201Q50 209 50 244Q50 346 98 438T227 601Q351 704 476 704Q514 704 524 703Q621 689 680 617T740 435Q740 255 592 107Q529 47 461 16L444 8V3Q444 2 449 -24T470 -66T516 -82Q551 -82 583 -60T625 -3Q631 11 638 11Q647 11 649 2Q649 -6 639 -34T611 -100T557 -165T481 -194Q399 -194 399 -87V-80ZM636 468Q636 523 621 564T580 625T530 655T477 665Q429 665 379 640Q277 591 215 464T153 216Q153 110 207 59Q231 38 236 38V46Q236 86 269 120T347 155Q372 155 390 144T417 114T429 82T435 55L448 64Q512 108 557 185T619 334T636 468ZM314 18Q362 18 404 39L403 49Q399 104 366 115Q354 117 347 117Q344 117 341 117T337 118Q317 118 296 98T274 52Q274 18 314 18Z"></path></g></g></g></svg></mjx-container></td>

</tbody>

<p>Each input is used exactly once. Both arrays come from DRAM.</p>
<p><span class="caption">Decimal units throughout: MB = 10<sup>6</sup> bytes, GB/s = 10<sup>9</sup> bytes/s.</span></p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header="Advanced Computer Architecture · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="aca" data-lang="en" lang="en" data-marpit-pagination="5" style="--paginate:true;--header:Advanced Computer Architecture · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:aca;--lang:en;" data-marpit-pagination-total="83">
<header>Advanced Computer Architecture · Monsoon 2026</header>
<h2 id="we-time-it-is-32-ms-good">We time it. Is 32 ms good?</h2>
<p>Suppose the loop takes <strong>32 ms</strong>.</p>
<div class="equation">32 million FLOPs / 0.032 s = <b>1 GFLOP/s</b></div>
<p>That number, on its own, cannot tell us whether this code is good or terrible.</p>
<blockquote>
<p>How fast <em>could</em> this machine compute? How fast <em>could</em> it feed the computation?</p>
</blockquote>
<p><span class="caption">All performance figures in this lecture are illustrative, constructed data.</span></p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="Advanced Computer Architecture · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-class="section" data-theme="aca" data-lang="en" lang="en" class="section" data-marpit-pagination="6" style="--paginate:true;--header:Advanced Computer Architecture · Monsoon 2026;--footer:IIIT · Suresh Purini;--class:section;--theme:aca;--lang:en;" data-marpit-pagination-total="83">
<header>Advanced Computer Architecture · Monsoon 2026</header>

<h2 id="first-the-compute-engine">First, the compute engine</h2>
<h1 id="what-does-peak-compute-mean">What does &quot;peak compute&quot; mean?</h1>
<p>The fastest arithmetic rate the execution units can sustain<br />
<strong>when instructions and operands are always ready.</strong></p>
<p>Start with one core, then scale to the machine.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="Advanced Computer Architecture · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="aca" data-lang="en" lang="en" data-marpit-pagination="7" style="--paginate:true;--header:Advanced Computer Architecture · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:aca;--lang:en;" data-marpit-pagination-total="83">
<header>Advanced Computer Architecture · Monsoon 2026</header>
<h2 id="one-core-two-vector-fma-units-four-lanes-each">One core: two vector FMA units, four lanes each</h2>
<p>Each unit starts <strong>one vector FMA per cycle</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">unit A:  [a0xb0+c0] [a1xb1+c1] [a2xb2+c2] [a3xb3+c3]
unit B:  [d0xe0+f0] [d1xe1+f1] [d2xe2+f2] [d3xe3+f3]
          lane 0     lane 1     lane 2     lane 3
</code></pre>
<p>Each box is one FP64 FMA = one multiply + one add = <strong>2 FLOPs</strong>.</p>
<div class="equation">2 units x 4 lanes x 2 FLOPs = <b>16 FLOPs/cycle</b></div>
<p>At <strong>2.0 GHz</strong>: 16 x 2 billion = <strong>32 GFLOP/s per core</strong>.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="Advanced Computer Architecture · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="aca" data-lang="en" lang="en" data-marpit-pagination="8" style="--paginate:true;--header:Advanced Computer Architecture · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:aca;--lang:en;" data-marpit-pagination-total="83">
<header>Advanced Computer Architecture · Monsoon 2026</header>
<h2 id="eight-cores-give-a-256-gflops-peak">Eight cores give a 256 GFLOP/s peak</h2>
<div class="equation">8 cores x 32 GFLOP/s = <b>256 GFLOP/s</b></div>
<p>This assumes vector FMA instructions and enough independent work to issue them.</p>
<p>Our dot product, at 1 GFLOP/s, is using <strong>0.39%</strong> of it.</p>
<blockquote>
<p>Does that prove we need better arithmetic code?</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header="Advanced Computer Architecture · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="aca" data-lang="en" lang="en" data-marpit-pagination="9" style="--paginate:true;--header:Advanced Computer Architecture · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:aca;--lang:en;" data-marpit-pagination-total="83">
<header>Advanced Computer Architecture · Monsoon 2026</header>
<h2 id="how-close-can-real-code-get-to-peak">How close can real code get to peak?</h2>
<p>We <em>estimated</em> 256 GFLOP/s. Now we want an <strong>empirical</strong> reference.</p>
<p>Pick a kernel that keeps the arithmetic units busy:</p>
<ul>
<li>many operations on data that is <strong>reused</strong>, and</li>
<li>enough independent work for the vector units and all cores.</li>
</ul>
<p><strong>Dense matrix multiplication</strong> is the standard choice.</p>
<blockquote>
<p>Run a tuned implementation; measure completed work per second.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="Advanced Computer Architecture · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="aca" data-lang="en" lang="en" data-marpit-pagination="10" style="--paginate:true;--header:Advanced Computer Architecture · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:aca;--lang:en;" data-marpit-pagination-total="83">
<header>Advanced Computer Architecture · Monsoon 2026</header>
<h2 id="established-benchmarks-linpack-and-dgemm">Established benchmarks: LINPACK and DGEMM</h2>
<p><strong>LINPACK / HPL</strong> solves a dense linear system <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.186ex;" xmlns="http://www.w3.org/2000/svg" width="6.979ex" height="1.805ex" role="img" focusable="false" viewBox="0 -716 3084.6 798"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D434" d="M208 74Q208 50 254 46Q272 46 272 35Q272 34 270 22Q267 8 264 4T251 0Q249 0 239 0T205 1T141 2Q70 2 50 0H42Q35 7 35 11Q37 38 48 46H62Q132 49 164 96Q170 102 345 401T523 704Q530 716 547 716H555H572Q578 707 578 706L606 383Q634 60 636 57Q641 46 701 46Q726 46 726 36Q726 34 723 22Q720 7 718 4T704 0Q701 0 690 0T651 1T578 2Q484 2 455 0H443Q437 6 437 9T439 27Q443 40 445 43L449 46H469Q523 49 533 63L521 213H283L249 155Q208 86 208 74ZM516 260Q516 271 504 416T490 562L463 519Q447 492 400 412L310 260L413 259Q516 259 516 260Z"></path></g><g data-mml-node="mi" transform="translate(750,0)"><path data-c="1D465" d="M52 289Q59 331 106 386T222 442Q257 442 286 424T329 379Q371 442 430 442Q467 442 494 420T522 361Q522 332 508 314T481 292T458 288Q439 288 427 299T415 328Q415 374 465 391Q454 404 425 404Q412 404 406 402Q368 386 350 336Q290 115 290 78Q290 50 306 38T341 26Q378 26 414 59T463 140Q466 150 469 151T485 153H489Q504 153 504 145Q504 144 502 134Q486 77 440 33T333 -11Q263 -11 227 52Q186 -10 133 -10H127Q78 -10 57 16T35 71Q35 103 54 123T99 143Q142 143 142 101Q142 81 130 66T107 46T94 41L91 40Q91 39 97 36T113 29T132 26Q168 26 194 71Q203 87 217 139T245 247T261 313Q266 340 266 352Q266 380 251 392T217 404Q177 404 142 372T93 290Q91 281 88 280T72 278H58Q52 284 52 289Z"></path></g><g data-mml-node="mo" transform="translate(1599.8,0)"><path data-c="3D" d="M56 347Q56 360 70 367H707Q722 359 722 347Q722 336 708 328L390 327H72Q56 332 56 347ZM56 153Q56 168 72 173H708Q722 163 722 153Q722 140 707 133H70Q56 140 56 153Z"></path></g><g data-mml-node="mi" transform="translate(2655.6,0)"><path data-c="1D44F" d="M73 647Q73 657 77 670T89 683Q90 683 161 688T234 694Q246 694 246 685T212 542Q204 508 195 472T180 418L176 399Q176 396 182 402Q231 442 283 442Q345 442 383 396T422 280Q422 169 343 79T173 -11Q123 -11 82 27T40 150V159Q40 180 48 217T97 414Q147 611 147 623T109 637Q104 637 101 637H96Q86 637 83 637T76 640T73 647ZM336 325V331Q336 405 275 405Q258 405 240 397T207 376T181 352T163 330L157 322L136 236Q114 150 114 114Q114 66 138 42Q154 26 178 26Q211 26 245 58Q270 81 285 114T318 219Q336 291 336 325Z"></path></g></g></g></svg></mjx-container>. Most of its work<br />
lands in optimised matrix operations.</p>
<p><strong>DGEMM</strong> benchmarks double-precision matrix multiplication directly. Simpler,<br />
and closer to what we want to measure.</p>
<p>Both exploit <strong>data reuse and parallel arithmetic</strong> to reach high FLOP rates.</p>
<p><span class="caption"><a href="https://www.netlib.org/benchmark/hpl/">HPL documentation</a> · use FP64 to match our peak estimate.</span></p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header="Advanced Computer Architecture · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="aca" data-lang="en" lang="en" data-marpit-pagination="11" style="--paginate:true;--header:Advanced Computer Architecture · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:aca;--lang:en;" data-marpit-pagination-total="83">
<header>Advanced Computer Architecture · Monsoon 2026</header>
<h2 id="from-a-benchmark-run-to-an-empirical-rate">From a benchmark run to an empirical rate</h2>
<ol>
<li>Choose a problem large enough to show reuse; keep it in RAM.</li>
<li>Run on all <strong>eight cores</strong>; warm up, repeat, check correctness.</li>
<li>Report <strong>work / time</strong>, with size, library and thread count.</li>
</ol>
<p>Suppose a tuned DGEMM run delivers <strong>230 GFLOP/s</strong>.</p>
<div class="equation"><b>256</b> GFLOP/s theoretical peak &nbsp;·&nbsp; <b>230</b> GFLOP/s measured reference</div>
<p><span class="caption">230 is illustrative. It is not a benchmark result from any host.</span></p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header="Advanced Computer Architecture · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-class="section" data-theme="aca" data-lang="en" lang="en" class="section" data-marpit-pagination="12" style="--paginate:true;--header:Advanced Computer Architecture · Monsoon 2026;--footer:IIIT · Suresh Purini;--class:section;--theme:aca;--lang:en;" data-marpit-pagination-total="83">
<header>Advanced Computer Architecture · Monsoon 2026</header>

<h2 id="next-the-data-supply">Next, the data supply</h2>
<h1 id="what-does-peak-bandwidth-mean">What does &quot;peak bandwidth&quot; mean?</h1>
<p>How many <strong>bytes per second</strong> can cross an interface?</p>
<p>A wide arithmetic engine still needs a steady stream of operands.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header="Advanced Computer Architecture · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="aca" data-lang="en" lang="en" data-marpit-pagination="13" style="--paginate:true;--header:Advanced Computer Architecture · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:aca;--lang:en;" data-marpit-pagination-total="83">
<header>Advanced Computer Architecture · Monsoon 2026</header>
<h2 id="estimate-the-memory-interface-peak">Estimate the memory interface peak</h2>
<p>T8's memory interface:</p>
<ul>
<li><strong>2</strong> independent channels,</li>
<li><strong>8</strong> data bytes per transfer, per channel,</li>
<li><strong>5 billion</strong> transfers/s on each channel.</li>
</ul>
<div class="equation">2 x 8 x 5 billion = <b>80 GB/s</b></div>
<p>That is the interface maximum. Useful sustained bandwidth is lower.</p>

<header>Advanced Computer Architecture · Monsoon 2026</header>
<h2 id="stream-measures-what-you-can-actually-sustain">STREAM measures what you can actually sustain</h2>
<p>Choose kernels that move a lot of data and do almost no arithmetic.</p>
<p><a href="https://www.cs.virginia.edu/stream/ref.html">STREAM</a> is the standard set:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Copy:   a[i] = b[i]
Triad:  a[i] = b[i] + scalar * c[i]
</code></pre>
<p>Use arrays <strong>much larger than the cache</strong>; repeat across core counts.</p>
<div class="equation">sustained bandwidth = <b>counted bytes / elapsed time</b></div>

<header>Advanced Computer Architecture · Monsoon 2026</header>
<h2 id="match-the-benchmark-to-the-access-pattern">Match the benchmark to the access pattern</h2>
<p><strong>STREAM Triad:</strong> two reads + one write = <strong>24 useful bytes</strong> per element.<br />
Real DRAM traffic can be higher, because of store allocation.</p>
<p><strong>Dot product:</strong> two reads = <strong>16 bytes</strong> per pair. No stores at all.</p>
<p>So for the dot product we use a tuned <strong>read-only</strong> streaming rate: <strong>64 GB/s</strong>.</p>
<blockquote>
<p>STREAM introduces sustained bandwidth. The access pattern decides <em>which</em><br />
sustained number is the right one.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>

<h2 id="predict-before-we-optimise">Predict, before we optimise</h2>
<p>Current time <strong>32 ms</strong>. The data-supply bound is <strong>4 ms</strong>.</p>
<p>Which change could get the time below 4 ms?</p>
<p><strong>A.</strong> Twice as many FMA units.<br />
<strong>B.</strong> A faster reduction loop, moving the same bytes.<br />
<strong>C.</strong> Twice the sustained DRAM bandwidth.<br />
<strong>D.</strong> A larger cache, still with one use of each input.</p>
<footer>IIIT · Suresh Purini</footer>
</section>

<header>Advanced Computer Architecture · Monsoon 2026</header>

<h2 id="the-machine-is-fixed-close-the-gap">The machine is fixed. Close the gap.</h2>
<h1 id="the-program-is-still-at-1-gflops">The program is still at 1 GFLOP/s.</h1>
<p>Its practical roof is <strong>8 GFLOP/s</strong>.</p>
<p>So what is stopping <em>this implementation</em> from getting closer?</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-header="Advanced Computer Architecture · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="aca" data-lang="en" lang="en" data-marpit-pagination="24" style="--paginate:true;--header:Advanced Computer Architecture · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:aca;--lang:en;" data-marpit-pagination-total="83">
<header>Advanced Computer Architecture · Monsoon 2026</header>
<h2 id="a-ceiling-is-not-the-same-as-saturation">A ceiling is not the same as saturation</h2>
<p>Our <strong>one-core</strong> read benchmark reached <strong>16 GB/s</strong>.<br />
For this kernel that supplies 16 x 0.125 = <strong>2 GFLOP/s</strong>.</p>
<table>
<thead>
<tr>
<th>one-core execution</th>
<th style="text-align:right">performance</th>
<th style="text-align:right">effective input rate</th>
</tr>
</thead>
<tbody>
<tr>
<td>original dot product</td>
<td style="text-align:right"><strong>1 GFLOP/s</strong></td>
<td style="text-align:right"><strong>8 GB/s</strong></td>
</tr>
<tr>
<td>one-core read envelope</td>
<td style="text-align:right"><strong>2 GFLOP/s</strong></td>
<td style="text-align:right"><strong>16 GB/s</strong></td>
</tr>
</tbody>
</table>
<p>The original loop is below <strong>even its one-core bandwidth ceiling</strong>.</p>
<blockquote>
<p>Hypothesis: the loop cannot <em>consume</em> data fast enough. Test it.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-header="Advanced Computer Architecture · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="aca" data-lang="en" lang="en" data-marpit-pagination="25" style="--paginate:true;--header:Advanced Computer Architecture · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:aca;--lang:en;" data-marpit-pagination-total="83">
<header>Advanced Computer Architecture · Monsoon 2026</header>
<h2 id="independent-sums-help-while-execution-is-the-limit">Independent sums help, while execution is the limit</h2>
<p>One accumulator means every iteration waits for the previous one:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">s0 += x[i]   * y[i];      // one dependency chain
s1 += x[i+1] * y[i+1];    // an independent one
</code></pre>
<p>Combine the partial sums at the end.<br />
<strong>Unrolling with the same accumulator keeps the dependency.</strong></p>
<p>Illustrative result (independent sums + SIMD): <strong>32 -&gt; 16 ms</strong>, <strong>8 -&gt; 16 GB/s</strong>.</p>
<blockquote>
<p>Once bandwidth is saturated, more arithmetic parallelism cannot raise the roof.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-header="Advanced Computer Architecture · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="aca" data-lang="en" lang="en" data-marpit-pagination="26" style="--paginate:true;--header:Advanced Computer Architecture · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:aca;--lang:en;" data-marpit-pagination-total="83">
<header>Advanced Computer Architecture · Monsoon 2026</header>
<h2 id="one-core-is-at-its-limit-the-chip-is-not">One core is at its limit. The chip is not.</h2>
<p>One core reaches 16 GB/s; eight cores together reach 64 GB/s.<br />
Split the same dot product into chunks, then combine.</p>
<table>
<thead>
<tr>
<th style="text-align:right">cores</th>
<th style="text-align:right">time</th>
<th style="text-align:right">dot input rate</th>
<th style="text-align:right">read-stream reference</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:right">1</td>
<td style="text-align:right">16 ms</td>
<td style="text-align:right">16 GB/s</td>
<td style="text-align:right">16 GB/s</td>
</tr>
<tr>
<td style="text-align:right">2</td>
<td style="text-align:right">8.6 ms</td>
<td style="text-align:right">29.8 GB/s</td>
<td style="text-align:right">30 GB/s</td>
</tr>
<tr>
<td style="text-align:right">4</td>
<td style="text-align:right">5 ms</td>
<td style="text-align:right">51.2 GB/s</td>
<td style="text-align:right">52 GB/s</td>
</tr>
<tr>
<td style="text-align:right">8</td>
<td style="text-align:right"><strong>4.4 ms</strong></td>
<td style="text-align:right"><strong>58.2 GB/s</strong></td>
<td style="text-align:right">64 GB/s</td>
</tr>
</tbody>
</table>
<p>More cores expose more <strong>aggregate memory concurrency</strong> — until the shared<br />
interface saturates.</p>
<p><span class="caption">Illustrative. At eight cores: 91% of the reference, so at most 1.1x headroom left.</span></p>
<footer>IIIT · Suresh Purini</footer>
</section>

<header>Advanced Computer Architecture · Monsoon 2026</header>
<h2 id="a-bottleneck-is-a-hypothesis-you-test">A bottleneck is a hypothesis you test</h2>
<table>
<thead>
<tr>
<th>observation</th>
<th>next controlled experiment</th>
</tr>
</thead>
<tbody>
<tr>
<td>low rate, one long dependency chain</td>
<td>add independent accumulators</td>
</tr>
<tr>
<td>low rate, scalar instructions</td>
<td>check that it vectorised</td>
</tr>
<tr>
<td>more threads raise throughput</td>
<td>continue the core-count sweep</td>
</tr>
<tr>
<td>throughput plateaus near the read rate</td>
<td>check DRAM traffic and placement</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Change one cause. Measure time <em>and</em> traffic again.</p>
</blockquote>
<p><strong>A point below the roof is not automatically bandwidth-bound.</strong></p>
<footer>IIIT · Suresh Purini</footer>
</section>

<header>Advanced Computer Architecture · Monsoon 2026</header>
<h2 id="would-blocking-the-dot-product-help">Would blocking the dot product help?</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">for each block:
    compute the dot product of that block
</code></pre>
<p>Every element is still read exactly once. Total DRAM traffic is still <strong>256 MB</strong>.</p>
<div class="punch">
<p><strong>No reusable input has appeared.</strong> A cache saves transfers only when data is<br />
used <em>again</em>.</p>
</div>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-header="Advanced Computer Architecture · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="aca" data-lang="en" lang="en" data-marpit-pagination="30" style="--paginate:true;--header:Advanced Computer Architecture · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:aca;--lang:en;" data-marpit-pagination-total="83">
<header>Advanced Computer Architecture · Monsoon 2026</header>
<h2 id="checkpoint-the-fixed-hardware-half">Checkpoint: the fixed-hardware half</h2>
<p>You can now answer three questions about any kernel:</p>
<ol>
<li><strong>How much headroom?</strong> Compare against the relevant roof.</li>
<li><strong>What experiment next?</strong> Test the missing compute or supply capability.</li>
<li><strong>Can traffic fall?</strong> Look for real reuse in the workload.</li>
</ol>
<p>Our dot product went from <strong>32 ms to 4.4 ms</strong> — about <strong>7.3x</strong>.</p>
<p><strong>Low FLOP utilisation and good performance can coexist.</strong></p>
<footer>IIIT · Suresh Purini</footer>
</section>

<header>Advanced Computer Architecture · Monsoon 2026</header>

<h2 id="one-machine-four-boundaries">One machine, four boundaries</h2>
<h1 id="there-is-no-such-thing-as-the-arithmetic-intensity">There is no such thing as <em>the</em> arithmetic intensity.</h1>
<p>Every boundary the data crosses has its own.</p>
<footer>IIIT · Suresh Purini</footer>
</section>

<p><strong>Separate passes</strong>, with <code>x</code> evicted in between:<br />
read <code>x, y</code>, then <code>x, z</code> — <strong>32 bytes</strong> per index.</p>
<p><strong>Fused pass:</strong> read <code>x[i], y[i], z[i]</code> once — <strong>24 bytes</strong> per index.</p>
<p>Same <strong>4 FLOPs</strong> per index. Intensity rises from <strong>1/8</strong> to <strong>1/6</strong>.</p>
<blockquote>

<h2 id="predict-we-block-harder-still">Predict: we block harder still</h2>
<p>Next step: tighten the blocking everywhere. Every cache captures more.</p>
<p><strong>L2: 2 -&gt; 1 GB.</strong>   <strong>L3: 1 -&gt; 0.5 GB.</strong>   <strong>DRAM: 0.25 -&gt; 0.125 GB.</strong></p>
<p>Three ceilings improve. Each of them <strong>doubles</strong>.</p>

</div>

<header>Advanced Computer Architecture · Monsoon 2026</header>
<h2 id="hit-rate-and-traffic-are-different-levers">Hit rate and traffic are different levers</h2>
<div class="punch">
<p>Raising a cache's hit rate reduces traffic at the levels <strong>further out</strong>.<br />
It never reduces traffic at <strong>that level itself</strong>.</p>
</div>
<p>L1's hit rate improved in steps 1–4. L1's own traffic never moved: the code<br />
still <em>issued</em> 8 GB of load requests.</p>
<p>To lower a level's own ceiling you must reduce the <strong>requests it ever sees</strong> —<br />
by keeping values in something closer. For L1, that means <strong>registers</strong>.</p>
<footer>IIIT · Suresh Purini</footer>
</section>

<h2 id="why-it-had-to-be-exactly-2x">Why it had to be exactly 2x</h2>
<p>One FP64 vector FMA consumes <strong>two fresh 32-byte vectors</strong> and produces<br />
4 lanes x 2 = <strong>8 FLOPs</strong>.</p>

<p>Both FMA units every cycle would demand <strong>128 bytes/cycle</strong>.<br />
T8's L1 supplies <strong>64</strong>.</p>
<div class="punch">

<header>Advanced Computer Architecture · Monsoon 2026</header>
<h2 id="four-things-to-take-from-the-walk">Four things to take from the walk</h2>
<ol>
<li><strong>Find the binding level first.</strong> Performance is a <code>min</code>. Optimising<br />
anything else changes nothing.</li>
<li><strong>Clearing one ceiling reveals the next.</strong> We moved the bottleneck four<br />
times: DRAM, L3, L2, L1.</li>
<li><strong>Hit rate and traffic are different levers.</strong> One clears outer ceilings;<br />
only fewer requests clears the level itself.</li>
<li><strong>&quot;Compute-bound&quot; is a diagnosis, not a goal.</strong> The objective is minimum<br />
runtime for useful work.</li>
</ol>

<header>Advanced Computer Architecture · Monsoon 2026</header>
<h2 id="the-architects-question-is-not-the-programmers">The architect's question is not the programmer's</h2>
<p>The programmer asks: <em>is my kernel memory-bound right now?</em></p>
<p>That question is about <strong>one point</strong> on a chart.</p>
<div class="punch">
<p>The architect has to ask instead:<br />
<strong>as capacity <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.05ex;" xmlns="http://www.w3.org/2000/svg" width="1.719ex" height="1.645ex" role="img" focusable="false" viewBox="0 -705 760 727"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D436" d="M50 252Q50 367 117 473T286 641T490 704Q580 704 633 653Q642 643 648 636T656 626L657 623Q660 623 684 649Q691 655 699 663T715 679T725 690L740 705H746Q760 705 760 698Q760 694 728 561Q692 422 692 421Q690 416 687 415T669 413H653Q647 419 647 422Q647 423 648 429T650 449T651 481Q651 552 619 605T510 659Q484 659 454 652T382 628T299 572T226 479Q194 422 175 346T156 222Q156 108 232 58Q280 24 350 24Q441 24 512 92T606 240Q610 253 612 255T628 257Q648 257 648 248Q648 243 647 239Q618 132 523 55T319 -22Q206 -22 128 53T50 252Z"></path></g></g></g></svg></mjx-container> grows, how fast does achievable <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.14ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 504 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D43C" d="M43 1Q26 1 26 10Q26 12 29 24Q34 43 39 45Q42 46 54 46H60Q120 46 136 53Q137 53 138 54Q143 56 149 77T198 273Q210 318 216 344Q286 624 286 626Q284 630 284 631Q274 637 213 637H193Q184 643 189 662Q193 677 195 680T209 683H213Q285 681 359 681Q481 681 487 683H497Q504 676 504 672T501 655T494 639Q491 637 471 637Q440 637 407 634Q393 631 388 623Q381 609 337 432Q326 385 315 341Q245 65 245 59Q245 52 255 50T307 46H339Q345 38 345 37T342 19Q338 6 332 0H316Q279 2 179 2Q143 2 113 2T65 2T43 1Z"></path></g></g></g></svg></mjx-container> grow?</strong></p>
</div>
<p>That function — not today's intensity — decides whether SRAM is worth buying.</p>

<header>Advanced Computer Architecture · Monsoon 2026</header>
<h2 id="now-choose-between-compute-area-and-cache-area">Now choose between compute area and cache area</h2>
<p>Reserve the memory interface, control, registers and interconnect first.<br />
We have <strong>100 area units left</strong> to divide between compute and cache.</p>
<table>
<thead>
<tr>
<th>Choice</th>
<th style="text-align:right">Compute area</th>
<th style="text-align:right">Cache area</th>
</tr>
</thead>
<tbody>
<tr>
<td>A: more ALUs</td>
<td style="text-align:right">75</td>
<td style="text-align:right">25</td>
</tr>
<tr>
<td>B: equal split</td>
<td style="text-align:right">50</td>
<td style="text-align:right">50</td>
</tr>
<tr>
<td>C: more cache</td>
<td style="text-align:right">25</td>
<td style="text-align:right">75</td>
</tr>
</tbody>
</table>
<p>Assume <strong>4 GFLOP/s per compute-area unit</strong>, at fixed frequency.<br />
DRAM bandwidth stays <strong>64 GB/s</strong>. Which choice will run faster?</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-header="Advanced Computer Architecture · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="aca" data-lang="en" lang="en" data-marpit-pagination="62" style="--paginate:true;--header:Advanced Computer Architecture · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:aca;--lang:en;" data-marpit-pagination-total="83">
<header>Advanced Computer Architecture · Monsoon 2026</header>
<h2 id="first-estimate-what-each-cache-size-buys">First estimate what each cache size buys</h2>
<p>For this reuse-rich workload, assume the following traffic model:</p>
<table>
<thead>
<tr>
<th>Choice</th>
<th style="text-align:right">Cache area</th>
<th style="text-align:right">DRAM intensity I</th>
<th style="text-align:right">Data can support: 64 × I</th>
</tr>
</thead>
<tbody>
<tr>
<td>A</td>
<td style="text-align:right">25</td>
<td style="text-align:right">1.406 FLOP/byte</td>
<td style="text-align:right"><strong>90 GFLOP/s</strong></td>
</tr>
<tr>
<td>B</td>
<td style="text-align:right">50</td>
<td style="text-align:right">1.989 FLOP/byte</td>
<td style="text-align:right"><strong>127 GFLOP/s</strong></td>
</tr>
<tr>
<td>C</td>
<td style="text-align:right">75</td>
<td style="text-align:right">2.436 FLOP/byte</td>
<td style="text-align:right"><strong>156 GFLOP/s</strong></td>
</tr>
</tbody>
</table>
<p>More cache captures more reuse. It lets the same DRAM link feed more work.</p>
<p><span class="caption">Illustrative square-root model; intensities and rates rounded. We would measure or simulate these for a real workload.</span></p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-header="Advanced Computer Architecture · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="aca" data-lang="en" lang="en" data-marpit-pagination="63" style="--paginate:true;--header:Advanced Computer Architecture · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:aca;--lang:en;" data-marpit-pagination-total="83">
<header>Advanced Computer Architecture · Monsoon 2026</header>
<h2 id="take-the-smaller-limit-which-design-wins">Take the smaller limit: which design wins?</h2>
<table>
<thead>
<tr>
<th>Choice</th>
<th style="text-align:right">Compute can do</th>
<th style="text-align:right">DRAM can feed</th>
<th style="text-align:right">Model ceiling</th>
</tr>
</thead>
<tbody>
<tr>
<td>A: more ALUs</td>
<td style="text-align:right">4 × 75 = 300</td>
<td style="text-align:right">90</td>
<td style="text-align:right"><strong>90</strong></td>
</tr>
<tr>
<td>B: equal split</td>
<td style="text-align:right">4 × 50 = 200</td>
<td style="text-align:right">127</td>
<td style="text-align:right"><strong>127</strong></td>
</tr>
<tr>
<td>C: more cache</td>
<td style="text-align:right">4 × 25 = 100</td>
<td style="text-align:right">156</td>
<td style="text-align:right"><strong>100</strong></td>
</tr>
</tbody>
</table>
<p>All rates are <strong>GFLOP/s</strong>. Pause and identify the limiting resource in each row.</p>
<p><strong>B wins among these three. Neither extreme wins.</strong><br />
A has arithmetic it cannot feed; C has supply its arithmetic cannot use.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-header="Advanced Computer Architecture · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="aca" data-lang="en" lang="en" data-marpit-pagination="64" style="--paginate:true;--header:Advanced Computer Architecture · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:aca;--lang:en;" data-marpit-pagination-total="83">
<header>Advanced Computer Architecture · Monsoon 2026</header>
<h2 id="can-we-improve-on-the-5050-split">Can we improve on the 50/50 split?</h2>
<p>B is still limited by data supply. Try moving some area <strong>from ALUs to cache</strong>.</p>
<table>
<thead>
<tr>
<th style="text-align:right">Cache area</th>
<th style="text-align:right">Compute area</th>
<th style="text-align:right">Compute limit</th>
<th style="text-align:right">Supply limit</th>
<th style="text-align:right">Ceiling</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:right">50</td>
<td style="text-align:right">50</td>
<td style="text-align:right">200</td>
<td style="text-align:right">127</td>
<td style="text-align:right"><strong>127</strong></td>
</tr>
<tr>
<td style="text-align:right"><strong>64</strong></td>
<td style="text-align:right"><strong>36</strong></td>
<td style="text-align:right"><strong>144</strong></td>
<td style="text-align:right"><strong>144</strong></td>
<td style="text-align:right"><strong>144</strong></td>
</tr>
<tr>
<td style="text-align:right">75</td>
<td style="text-align:right">25</td>
<td style="text-align:right">100</td>
<td style="text-align:right">156</td>
<td style="text-align:right"><strong>100</strong></td>
</tr>
</tbody>
</table>
<p>Rates are GFLOP/s, from the same model.</p>
<p>At 64 cache units: <strong>4 × 36 = 144</strong> and <strong>64 GB/s × 2.25 = 144</strong>.<br />
More cache beyond this point takes away compute we still need.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-header="Advanced Computer Architecture · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="aca" data-lang="en" lang="en" data-marpit-pagination="65" style="--paginate:true;--header:Advanced Computer Architecture · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:aca;--lang:en;" data-marpit-pagination-total="83">
<header>Advanced Computer Architecture · Monsoon 2026</header>
<h2 id="but-reuse-can-run-out">But reuse can run out</h2>
<p>Now consider a workload whose traffic stops falling at <strong>16 cache-area units</strong>.</p>
<p>One execution does <strong>72 million FLOPs</strong> and still transfers <strong>64 MB</strong> from DRAM.<br />
More cache cannot eliminate those remaining transfers.</p>
<div class="equation">Maximum intensity = 72 / 64 = <b>1.125 FLOP/byte</b><br />DRAM supply limit = 64 × 1.125 = <b>72 GFLOP/s</b></div>
<blockquote>
<p>Once traffic stops falling, extra cache no longer raises this supply limit.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>

<h2 id="several-area-splits-can-now-be-equally-fast">Several area splits can now be equally fast</h2>
<p>The supply limit remains <strong>72 GFLOP/s</strong> once cache area reaches 16.</p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-paginate="true" data-header="Advanced Computer Architecture · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="aca" data-lang="en" lang="en" data-marpit-pagination="68" style="--paginate:true;--header:Advanced Computer Architecture · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:aca;--lang:en;" data-marpit-pagination-total="83">
<header>Advanced Computer Architecture · Monsoon 2026</header>
<h2 id="match-the-machine-to-the-work-per-byte">Match the machine to the work per byte</h2>
<p>Suppose two designs have different compute and bandwidth budgets:</p>
<table>
<thead>
<tr>
<th>Design</th>
<th style="text-align:right">Compute peak</th>
<th style="text-align:right">DRAM bandwidth</th>
<th style="text-align:right">Ridge = peak / bandwidth</th>
</tr>
</thead>
<tbody>
<tr>
<td>X</td>
<td style="text-align:right">256 GFLOP/s</td>
<td style="text-align:right">64 GB/s</td>
<td style="text-align:right"><strong>4 FLOP/byte</strong></td>
</tr>
<tr>
<td>Y</td>
<td style="text-align:right">512 GFLOP/s</td>
<td style="text-align:right">32 GB/s</td>
<td style="text-align:right"><strong>16 FLOP/byte</strong></td>
</tr>
</tbody>
</table>
<p>For dot product, I = 0.125: <strong>X can feed 8 GFLOP/s; Y only 4</strong>.<br />
For a kernel with I = 32: the roofs are <strong>256 and 512 GFLOP/s</strong>.</p>
<p>A high ridge demands more reuse. It can be a <strong>declaration of intent</strong>.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-paginate="true" data-header="Advanced Computer Architecture · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="aca" data-lang="en" lang="en" data-marpit-pagination="69" style="--paginate:true;--header:Advanced Computer Architecture · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:aca;--lang:en;" data-marpit-pagination-total="83">
<header>Advanced Computer Architecture · Monsoon 2026</header>
<h2 id="make-an-architecture-decision-in-four-steps">Make an architecture decision in four steps</h2>
<ol>
<li>Pick the workloads and problem sizes that matter.</li>
<li>For each cache candidate, estimate <strong>how many bytes it saves</strong>.</li>
<li>Compare <strong>compute rate</strong> with <strong>bandwidth × intensity</strong> at every relevant boundary.</li>
<li>Check the promising designs for <strong>power, latency, frequency, and cost</strong>.</li>
</ol>
<blockquote>
<p>Buy a resource only when the workload can use what it adds.</p>
</blockquote>
<p>Roofline narrows the candidates; measurement and simulation test them.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-paginate="true" data-header="Advanced Computer Architecture · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="aca" data-lang="en" lang="en" data-marpit-pagination="70" style="--paginate:true;--header:Advanced Computer Architecture · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:aca;--lang:en;" data-marpit-pagination-total="83">
<header>Advanced Computer Architecture · Monsoon 2026</header>
<h2 id="two-perspectives-one-habit">Two perspectives, one habit</h2>
<table>
<thead>
<tr>
<th>Hardware fixed: improve the program</th>
<th>Area fixed: improve the machine</th>
</tr>
</thead>
<tbody>
<tr>
<td>Find the current limiting resource</td>
<td>Find the resource worth investing in</td>
</tr>
<tr>
<td>Expose parallel work to approach a roof</td>
<td>Add ALUs when data can feed them</td>
</tr>
<tr>
<td>Reuse data to reduce transfers</td>
<td>Add cache when it captures useful reuse</td>
</tr>
<tr>
<td>Measure again after each change</td>
<td>Reevaluate all candidate workloads</td>
</tr>
</tbody>
</table>
<p><strong>Count work. Count bytes. Name the boundary. Take the smallest limit.</strong></p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-paginate="true" data-header="Advanced Computer Architecture · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="aca" data-lang="en" lang="en" data-marpit-pagination="71" style="--paginate:true;--header:Advanced Computer Architecture · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:aca;--lang:en;" data-marpit-pagination-total="83">
<header>Advanced Computer Architecture · Monsoon 2026</header>
<h2 id="exit-ticket-compute-the-two-limits">Exit ticket: compute the two limits</h2>
<p>A kernel does <strong>64 million FLOPs</strong>, reads <strong>128 MB</strong> from DRAM,<br />
and takes <strong>4 ms</strong> on T8.</p>
<p>Use <strong>256 GFLOP/s compute peak</strong> and <strong>64 GB/s DRAM bandwidth</strong>.</p>
<ol>
<li>What are its intensity and measured performance?</li>
<li>What is its DRAM roof? How much headroom remains?</li>
<li>Would doubling the ALUs raise that roof?</li>
</ol>
<blockquote>
<p>Write the units next to every calculation.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-paginate="true" data-header="Advanced Computer Architecture · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="aca" data-lang="en" lang="en" data-marpit-pagination="72" style="--paginate:true;--header:Advanced Computer Architecture · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:aca;--lang:en;" data-marpit-pagination-total="83">
<header>Advanced Computer Architecture · Monsoon 2026</header>
<h2 id="exit-ticket-work-through-the-numbers">Exit ticket: work through the numbers</h2>
<p><strong>Intensity:</strong> 64 million FLOPs / 128 MB = <strong>0.5 FLOP/byte</strong>.</p>
<p><strong>Measured rate:</strong> 64 million FLOPs / 4 ms = <strong>16 GFLOP/s</strong>.</p>
<p><strong>DRAM supply limit:</strong> 64 GB/s × 0.5 = <strong>32 GFLOP/s</strong>.</p>
<p><strong>Roof:</strong> min(256, 32) = <strong>32 GFLOP/s</strong>, or a best time of <strong>2 ms</strong>.</p>
<p>At most <strong>2x</strong> speedup remains in this model.<br />
Doubling ALUs leaves the 32 GFLOP/s supply limit unchanged.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-paginate="true" data-header="Advanced Computer Architecture · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="aca" data-lang="en" lang="en" data-marpit-pagination="73" style="--paginate:true;--header:Advanced Computer Architecture · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:aca;--lang:en;" data-marpit-pagination-total="83">
<header>Advanced Computer Architecture · Monsoon 2026</header>
<h2 id="exit-ticket-now-include-l1-loads">Exit ticket: now include L1 loads</h2>
<p>The same kernel also loads <strong>512 MB from L1 into registers</strong>.<br />
L1 supplies <strong>1024 GB/s</strong> across all eight cores.</p>
<p><strong>I at L1:</strong> 64 / 512 = <strong>0.125 FLOP/byte</strong>.<br />
<strong>L1 supply limit:</strong> 1024 × 0.125 = <strong>128 GFLOP/s</strong>.</p>
<table>
<thead>
<tr>
<th style="text-align:right">DRAM bytes, with L1 loads unchanged</th>
<th style="text-align:right">DRAM limit</th>
<th style="text-align:right">Overall roof</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:right">128 MB</td>
<td style="text-align:right">32 GFLOP/s</td>
<td style="text-align:right"><strong>32 GFLOP/s</strong></td>
</tr>
<tr>
<td style="text-align:right">64 MB</td>
<td style="text-align:right">64 GFLOP/s</td>
<td style="text-align:right"><strong>64 GFLOP/s</strong></td>
</tr>
<tr>
<td style="text-align:right">16 MB</td>
<td style="text-align:right">256 GFLOP/s</td>
<td style="text-align:right"><strong>128 GFLOP/s: L1 limits it</strong></td>
</tr>
</tbody>
</table>
<p>Less DRAM traffic helps until another resource becomes the limit.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="74" data-paginate="true" data-header="Advanced Computer Architecture · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="aca" data-lang="en" lang="en" data-marpit-pagination="74" style="--paginate:true;--header:Advanced Computer Architecture · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:aca;--lang:en;" data-marpit-pagination-total="83">
<header>Advanced Computer Architecture · Monsoon 2026</header>
<h2 id="what-changes-for-gpus-npus-and-energy">What changes for GPUs, NPUs, and energy?</h2>
<p><strong>GPUs and NPUs:</strong> count their compute resources, data movement, and reuse.<br />
The same bottleneck questions apply, with different numbers.</p>
<p><strong>Energy:</strong> count the arithmetic and transfers again, then assign an energy cost to each.<br />
The fastest design need not use the least energy.</p>
<p>We will revisit these choices in L25.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="75" data-paginate="true" data-header="Advanced Computer Architecture · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="aca" data-lang="en" lang="en" data-marpit-pagination="75" style="--paginate:true;--header:Advanced Computer Architecture · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:aca;--lang:en;" data-marpit-pagination-total="83">
<header>Advanced Computer Architecture · Monsoon 2026</header>
<h2 id="what-to-remember">What to remember</h2>
<ol>
<li><strong>Capacity</strong> tells us what can stay nearby; <strong>bandwidth</strong> tells us how fast bytes arrive.</li>
<li>Each boundary has its own traffic count and intensity.</li>
<li>Improve the <strong>smallest current limit</strong>, then check again.</li>
<li>More cache helps only if the workload benefits from the extra capacity.</li>
<li>More ALUs help only if the rest of the machine can feed them.</li>
</ol>
<blockquote>
<p>There is no workload-independent best cache/ALU split.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="76" data-paginate="true" data-header="Advanced Computer Architecture · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-class="section" data-theme="aca" data-lang="en" lang="en" class="section" data-marpit-pagination="76" style="--paginate:true;--header:Advanced Computer Architecture · Monsoon 2026;--footer:IIIT · Suresh Purini;--class:section;--theme:aca;--lang:en;" data-marpit-pagination-total="83">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" data-paginate="true" data-header="Advanced Computer Architecture · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="aca" data-lang="en" lang="en" data-marpit-pagination="77" style="--paginate:true;--header:Advanced Computer Architecture · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:aca;--lang:en;" data-marpit-pagination-total="83">
<header>Advanced Computer Architecture · Monsoon 2026</header>
<h2 id="optional-write-the-area-exercise-as-an-equation">Optional: write the area exercise as an equation</h2>
<p>Let <strong>m</strong> be cache area out of <strong>100 available area units</strong>.<br />
Then compute area is <strong>100 - m</strong>.</p>
<table>
<thead>
<tr>
<th>Model term</th>
<th>Assumption</th>
<th>Units</th>
</tr>
</thead>
<tbody>
<tr>
<td>Compute limit</td>
<td>4(100 - m)</td>
<td>GFLOP/s</td>
</tr>
<tr>
<td>DRAM intensity</td>
<td>(9/32) × sqrt(m)</td>
<td>FLOP/byte</td>
</tr>
<tr>
<td>DRAM supply limit</td>
<td>64 × intensity = 18 sqrt(m)</td>
<td>GFLOP/s</td>
</tr>
</tbody>
</table>

<h2 id="a-reproducible-benchmark-record">A reproducible benchmark record</h2>
<p>Record <strong>CPU, precision, compiler and flags, affinity, clock, <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="2.009ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 888 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D441" d="M234 637Q231 637 226 637Q201 637 196 638T191 649Q191 676 202 682Q204 683 299 683Q376 683 387 683T401 677Q612 181 616 168L670 381Q723 592 723 606Q723 633 659 637Q635 637 635 648Q635 650 637 660Q641 676 643 679T653 683Q656 683 684 682T767 680Q817 680 843 681T873 682Q888 682 888 672Q888 650 880 642Q878 637 858 637Q787 633 769 597L620 7Q618 0 599 0Q585 0 582 2Q579 5 453 305L326 604L261 344Q196 88 196 79Q201 46 268 46H278Q284 41 284 38T282 19Q278 6 272 0H259Q228 2 151 2Q123 2 100 2T63 2T46 1Q31 1 31 10Q31 14 34 26T39 40Q41 46 62 46Q130 49 150 85Q154 91 221 362L289 634Q287 635 234 637Z"></path></g></g></g></svg></mjx-container>, cache state</strong>.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">allocate + initialise + establish NUMA placement   // outside the timer
warm up the intended configuration
repeat: establish intended residency; time only the kernel
consume and check the output; keep every timing
</code></pre>
<p>Report work/time, traffic/time, and the run-to-run variation.</p>

<h2 id="small-problems-ask-a-different-question">Small problems ask a different question</h2>
<p>If both arrays fit in cache, repeated dot products may transfer almost no DRAM<br />
bytes after the first pass.</p>
<p>They still load values <strong>from cache into registers</strong> — a different boundary,<br />
with a different bandwidth.</p>
<p><strong>Sweep the problem size</strong> to find the transitions between resident and<br />
streaming behaviour.</p>
<blockquote>
<p>Never use a DRAM byte count for a warm-cache benchmark.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>

<h2 id="low-bandwidth-can-mean-too-little-concurrency">Low bandwidth can mean too little concurrency</h2>
<p>Suppose a request returns <strong>64 bytes</strong> after <strong>100 ns</strong>.<br />
One outstanding request sustains only <strong>0.64 GB/s</strong>.</p>
<p>To sustain <strong>64 GB/s</strong>:</p>
<div class="equation">64 GB/s x 100 ns / 64 bytes = <b>100 requests in flight</b></div>
<p>Independent misses, prefetching and more cores all help fill the pipe.</p>
<footer>IIIT · Suresh Purini</footer>
</section>

<header>Advanced Computer Architecture · Monsoon 2026</header>
<h2 id="what-the-model-still-cannot-see">What the model still cannot see</h2>
<ul>
<li><strong>Latency and dependencies.</strong> A pointer chase is nowhere near any roof.</li>
<li><strong>Instruction issue.</strong> Non-FLOP work — addressing, branches, shuffles —<br />
competes for slots.</li>
<li><strong>Store traffic and allocation.</strong> We counted loads at L1 throughout.</li>
<li><strong>Sharing.</strong> Other cores and other tenants move your effective bandwidth.</li>
<li><strong>Which 90% of the time is spent where.</strong> Roofline is per-kernel, not<br />
per-application.</li>
</ul>
<p><strong>It bounds. It does not explain.</strong></p>
<footer>IIIT · Suresh Purini</footer>
</section>
